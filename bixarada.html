    <div class="modal-head">
      <h3>
        <span>🍽️</span>
        <span>O que o Billy vai comer?</span>
      </h3>
      <button class="close-btn" id="btnCloseFood">✕</button>
    </div>
    <div class="modal-body">
      <div class="game-desc">
        Escolha um alimento para alimentar o <strong>Billy Byte</strong>. Cada comida restaura uma quantidade diferente de fome!
      </div>
      <div class="food-grid" id="foodGrid"></div>
    </div>
  </div>
</div>

<!-- GAME PICKER -->
<div class="game-picker" id="gamePicker">
  <div class="picker-panel">
    <h3>🎮 Escolha um minigame</h3>
    <div class="picker-grid" id="pickerGrid"></div>
    <button class="picker-close" id="btnPickerClose">Fechar</button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ================================================================
   BILLY BYTE — Mascote das Escolas do Futuro
   ================================================================ */
(function () {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = (arr) => arr[rand(0, arr.length - 1)];
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = rand(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ============================================================
     TEMPO REAL: FOME ZERA EM 45 MIN, SONO EM 1H30
     ============================================================ */
  const FOME_DURACAO_MS = 45 * 60 * 1000;        // 45 minutos
  const SONO_DURACAO_MS = 90 * 60 * 1000;        // 1 hora e 30 minutos
  const TICK_MS = 1000;                           // atualiza a cada 1s

  /* ============================================================
     ESTADO
     ============================================================ */
  const state = {
    hunger: 100,
    happy: 80,
    sleep: 100,
    sleeping: false,
    currentScene: 'garden',  // garden | kitchen | bedroom
    lastTick: Date.now()
  };

  /* ============================================================
     CENÁRIOS
     ============================================================ */
  const scenes = {
    garden: $('#sceneGarden'),
    kitchen: $('#sceneKitchen'),
    bedroom: $('#sceneBedroom')
  };

  const btnBack = $('#btnBack');
  const billyStage = $('#billyStage');

  function switchScene(sceneName) {
    if (state.currentScene === sceneName) return;

    // Esconde todas as cenas
    Object.values(scenes).forEach(s => {
      s.classList.remove('active');
      if (s.id === 'sceneGarden') s.classList.remove('hidden');
    });

    // Mostra a cena nova
    if (sceneName === 'garden') {
      scenes.garden.classList.remove('hidden');
      btnBack.classList.remove('show');
    } else {
      scenes.garden.classList.add('hidden');
      scenes[sceneName].classList.add('active');
      btnBack.classList.add('show');
    }

    state.currentScene = sceneName;
  }

  btnBack.addEventListener('click', () => {
    if (state.sleeping) {
      // Se estiver dormindo, primeiro acorda
      wakeUp();
    }
    switchScene('garden');
  });

  /* ============================================================
     ELEMENTOS
     ============================================================ */
  const billyWrapper = $('#billyWrapper');
  const billyBody = $('#billyBody');
  const moodBubble = $('#moodBubble');
  const hungerBar = $('#hungerBar');
  const happyBar = $('#happyBar');
  const sleepBar = $('#sleepBar');
  const hintEl = $('#hint');
  const toastContainer = $('#toastContainer');

  /* ============================================================
     TOAST
     ============================================================ */
  function showToast(text, duration = 2200) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    toastContainer.appendChild(t);
    setTimeout(() => {
      t.classList.add('fade-out');
      setTimeout(() => t.remove(), 400);
    }, duration);
  }

  /* ============================================================
     MOOD
     ============================================================ */
  let moodTimeout = null;
  function showMood(emoji, duration = 1500) {
    moodBubble.textContent = emoji;
    moodBubble.classList.add('show');
    clearTimeout(moodTimeout);
    moodTimeout = setTimeout(() => moodBubble.classList.remove('show'), duration);
  }

  /* ============================================================
     STATS
     ============================================================ */
  function updateStats() {
    hungerBar.style.width = state.hunger + '%';
    happyBar.style.width = state.happy + '%';
    sleepBar.style.width = state.sleep + '%';
    [hungerBar, happyBar, sleepBar].forEach(bar => {
      const val = parseFloat(bar.style.width);
      bar.classList.remove('low', 'mid');
      if (val < 25) bar.classList.add('low');
      else if (val < 55) bar.classList.add('mid');
    });
  }

  /* ============================================================
     ANIMAÇÕES
     ============================================================ */
  function animateBilly(cls, dur = 800) {
    billyBody.classList.add(cls);
    setTimeout(() => billyBody.classList.remove(cls), dur);
  }
  function billyTalk(dur = 1500) {
    billyBody.classList.add('talking');
    setTimeout(() => billyBody.classList.remove('talking'), dur);
  }
  function billyHappy(dur = 1200) {
    billyBody.classList.add('happy');
    setTimeout(() => billyBody.classList.remove('happy'), dur);
  }
  function billyWave() { animateBilly('waving', 1800); }

  /* ============================================================
     EFEITOS
     ============================================================ */
  function spawnHearts(count = 5) {
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + 80;
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = pick(['💚', '💕', '💖', '💗']);
      h.style.left = (cx + rand(-80, 80)) + 'px';
      h.style.top = (cy + rand(-20, 20)) + 'px';
      h.style.animationDelay = (i * 0.12) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1800 + i * 120);
    }
  }

  function spawnBubbles(count = 8) {
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + 150;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'bubble-float';
      const size = rand(20, 50);
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (cx + rand(-100, 100)) + 'px';
      b.style.top = (cy + rand(-40, 40)) + 'px';
      b.style.animationDelay = (i * 0.08) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 2200 + i * 100);
    }
  }

  function spawnFlyingItem(emoji, fromX, fromY) {
    const rect = billyWrapper.getBoundingClientRect();
    const tx = rect.left + rect.width / 2;
    const ty = rect.top + rect.height / 2;
    const el = document.createElement('div');
    el.className = 'flying-item';
    el.textContent = emoji;
    el.style.left = fromX + 'px';
    el.style.top = fromY + 'px';
    el.style.setProperty('--dx', (tx - fromX) + 'px');
    el.style.setProperty('--dy', (ty - fromY) + 'px');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  function spawnZzz() {
    if (!state.sleeping) return;
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + 50;
    const z = document.createElement('div');
    z.className = 'zzz';
    z.textContent = 'Z';
    z.style.left = (cx + rand(-20, 20)) + 'px';
    z.style.top = cy + 'px';
    z.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(z);
    setTimeout(() => z.remove(), 3200);
  }

  /* ============================================================
     FALAS
     ============================================================ */
  const billyDialogs = {
    pet: ["Adoro carinho! 💚", "Você é o melhor!", "Isso me deixa feliz!", "Mais carinho, por favor!", "Aww, que gostoso!"],
    tickle: ["Hahaha! Para! 😂", "Não! Cócegas! Hihihi!", "Você me pegou! Hahaha!", "Para, para! 🤣", "Cócegas não! Hahaha!"],
    feed: ["Hmm, que delícia! 😋", "Obrigado pela comida!", "Nham nham!", "Adorei! 🍎", "Isso mata minha fome!"],
    play: ["Uhuu! Vamos brincar! 🎾", "Adoro brincar!", "Pega, pega!", "Isso é divertido!", "De novo, de novo!"],
    sleep: ["Boa noite... 💤", "Zzzzz... soninho...", "Vou dormir um pouquinho...", "Bons sonhos..."],
    wake: ["Hmm... acordei! Bom dia!", "Que cochilo bom!", "Oi! Dormi bem!", "Acordei cheio de energia! ⚡"],
    dance: ["Vem dançar comigo! 🎵", "Olha meus passos!", "A música me contagia!", "Dançar é bom demais!"],
    surprise: ["Surpresa! 🎉", "Olha o que eu sei fazer!", "Uhuuu! Que legal!", "Adoro surpresas! ✨"],
    hungry: ["Tô com fome... 🍖", "Minha barriga tá roncando!", "Comida, por favor!", "Quando a gente vai comer?"],
    sleepy: ["Tô com soninho... 😴", "Preciso dormir...", "Que sono!", "Meus olhinhos estão pesados..."]
  };

  function billySpeak(key) {
    const text = pick(billyDialogs[key] || ["Hmm..."]);
    billyTalk();
    addChatMessage(text, 'billy');
    return text;
  }

  /* ============================================================
     COMIDAS
     ============================================================ */
  const foods = [
    { emoji: '🍎', name: 'Maçã', value: 15 },
    { emoji: '🍌', name: 'Banana', value: 15 },
    { emoji: '🍕', name: 'Pizza', value: 30 },
    { emoji: '🍔', name: 'Hambúrguer', value: 35 },
    { emoji: '🍟', name: 'Batata Frita', value: 20 },
    { emoji: '🍫', name: 'Chocolate', value: 25 },
    { emoji: '🍩', name: 'Donut', value: 25 },
    { emoji: '🍪', name: 'Biscoito', value: 15 },
    { emoji: '🥗', name: 'Salada', value: 20 },
    { emoji: '🍜', name: 'Lámen', value: 30 },
    { emoji: '🍦', name: 'Sorvete', value: 20 },
    { emoji: '🥛', name: 'Leite', value: 10 }
  ];

  function buildFoodGrid() {
    const grid = $('#foodGrid');
    grid.innerHTML = '';
    foods.forEach((food, idx) => {
      const item = document.createElement('div');
      item.className = 'food-item';
      item.innerHTML = `
        <div class="food-emoji">${food.emoji}</div>
        <div class="food-name">${food.name}</div>
        <div class="food-value">+${food.value} fome</div>
      `;
      item.addEventListener('click', (e) => {
        eatFood(food, e);
      });
      grid.appendChild(item);
    });
  }

  function eatFood(food, event) {
    closeFoodModal();
    if (state.hunger >= 100) {
      showToast("Billy já está satisfeito! 😊");
      return;
    }
    // Spawn comida voando do centro do modal
    spawnFlyingItem(food.emoji, window.innerWidth / 2, window.innerHeight / 2);
    setTimeout(() => {
      state.hunger = clamp(state.hunger + food.value, 0, 100);
      state.happy = clamp(state.happy + 3, 0, 100);
      updateStats();
      billySpeak('feed');
      showMood('😋');
      billyHappy();
      spawnHearts(4);
    }, 900);
  }

  function openFoodModal() {
    $('#foodModal').classList.add('active');
  }
  function closeFoodModal() {
    $('#foodModal').classList.remove('active');
  }
  $('#btnCloseFood').addEventListener('click', closeFoodModal);
  $('#foodModal').addEventListener('click', (e) => {
    if (e.target === $('#foodModal')) closeFoodModal();
  });

  /* ============================================================
     AÇÕES
     ============================================================ */
  function actionFeed(e) {
    if (state.sleeping) return;
    if (state.hunger >= 100) { showToast("Billy já está satisfeito! 😊"); return; }
    // Vai para a cozinha
    switchScene('kitchen');
    // Abre o menu de comidas
    openFoodModal();
  }

  function actionPet() {
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 8, 0, 100);
    updateStats();
    billySpeak('pet');
    showMood('💚');
    billyHappy();
    spawnHearts(5);
  }

  function actionTickle() {
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 12, 0, 100);
    state.sleep = clamp(state.sleep - 3, 0, 100);
    updateStats();
    billySpeak('tickle');
    showMood('😂');
    billyBody.style.transform = 'rotate(-5deg)';
    setTimeout(() => billyBody.style.transform = 'rotate(5deg)', 120);
    setTimeout(() => billyBody.style.transform = 'rotate(0)', 240);
    spawnHearts(4);
  }

  function actionPlay() {
    if (state.sleeping) return;
    if (state.sleep < 15) { showToast("Billy está com muito sono! Deixe ele dormir. 💤"); return; }
    state.happy = clamp(state.happy + 15, 0, 100);
    state.sleep = clamp(state.sleep - 10, 0, 100);
    state.hunger = clamp(state.hunger - 5, 0, 100);
    updateStats();
    billySpeak('play');
    showMood('🎾');
    spawnBubbles(10);
    billyWave();
  }

  function putToSleep() {
    if (state.sleeping) return;
    state.sleeping = true;
    billyBody.classList.add('sleeping');
    billySpeak('sleep');
    showMood('💤');
    // Vai para o quarto
    switchScene('bedroom');

    // Gera Zzz periodicamente
    const zzzInterval = setInterval(() => {
      if (!state.sleeping) { clearInterval(zzzInterval); return; }
      spawnZzz();
    }, 1200);

    // Recupera sono gradualmente
    const sleepRecover = setInterval(() => {
      if (!state.sleeping) { clearInterval(sleepRecover); return; }
      state.sleep = clamp(state.sleep + 1, 0, 100);
      updateStats();
      if (state.sleep >= 100) {
        clearInterval(sleepRecover);
        // Acorda automaticamente
        setTimeout(() => {
          if (state.sleeping) wakeUp();
        }, 500);
      }
    }, 800);
  }

  function wakeUp() {
    if (!state.sleeping) return;
    state.sleeping = false;
    billyBody.classList.remove('sleeping');
    billySpeak('wake');
    showMood('🌞');
    billyHappy(1500);
    // Volta ao jardim
    switchScene('garden');
  }

  function actionSleep() {
    if (state.sleeping) {
      wakeUp();
      return;
    }
    putToSleep();
  }

  function actionDance() {
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 10, 0, 100);
    state.sleep = clamp(state.sleep - 5, 0, 100);
    updateStats();
    billySpeak('dance');
    showMood('🎵');
    let step = 0;
    const iv = setInterval(() => {
      billyBody.style.transform = `rotate(${step % 2 === 0 ? -4 : 4}deg) translateY(${step % 2 === 0 ? -6 : 0}px)`;
      step++;
      if (step > 12) { clearInterval(iv); billyBody.style.transform = ''; }
    }, 100);
  }

  function actionSurprise() {
    if (state.sleeping) return;
    billySpeak('surprise');
    showMood('✨');
    billyHappy();
    spawnHearts(6);
    spawnBubbles(6);
  }

  /* ============================================================
     MINIGAMES
     ============================================================ */
  const games = [
    { id: 'guess',  icon: '🎲', name: 'Adivinha',   badge: '1–100',   init: initGuessGame },
    { id: 'memory', icon: '🧠', name: 'Memória',    badge: '6 pares', init: initMemoryGame },
    { id: 'math',   icon: '🧮', name: 'Matemática', badge: 'Cálculo', init: initMathGame }
  ];

  const gamePicker = $('#gamePicker');
  const pickerGrid = $('#pickerGrid');
  const modal = $('#modal');
  const modalIcon = $('#modalIcon');
  const modalName = $('#modalName');
  const modalBadge = $('#modalBadge');
  const modalBody = $('#modalBody');

  function buildPicker() {
    pickerGrid.innerHTML = '';
    games.forEach(g => {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.innerHTML = `<div class="icon">${g.icon}</div><div class="name">${g.name}</div>`;
      item.addEventListener('click', () => {
        gamePicker.classList.remove('active');
        openGame(g.id);
      });
      pickerGrid.appendChild(item);
    });
  }

  function openGame(gameId) {
    const game = games.find(g => g.id === gameId);
    if (!game) return;
    modalIcon.textContent = game.icon;
    modalName.textContent = game.name;
    modalBadge.textContent = game.badge;
    modalBody.innerHTML = '';
    game.init(modalBody);
    modal.classList.add('active');
  }

  function closeModal() { modal.classList.remove('active'); }

  $('#btnCloseModal').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  $('#btnPickerClose').addEventListener('click', () => gamePicker.classList.remove('active'));
  gamePicker.addEventListener('click', e => { if (e.target === gamePicker) gamePicker.classList.remove('active'); });

  /* JOGO 1: ADIVINHA */
  function initGuessGame(root) {
    let secret = rand(1, 100);
    let attempts = 0;
    root.innerHTML = `
      <div class="game-desc">🎲 Pensei num número entre <strong>1 e 100</strong>.</div>
      <div class="guess-display">
        <div class="guess-range">Intervalo · 1 — 100</div>
        <div class="guess-number" id="gDisplay">?</div>
        <div class="guess-attempts">Tentativas: <strong id="gAttempts">0</strong></div>
      </div>
      <div class="guess-controls">
        <input type="number" class="num-input" id="gInput" min="1" max="100" placeholder="?" />
        <button class="btn btn-primary" id="gBtn">Chutar</button>
        <button class="btn" id="gNew">🔄 Novo</button>
      </div>
      <div class="feedback" id="gFeedback">Digite um número e clique em "Chutar".</div>
    `;
    const input = $('#gInput', root);
    const btn = $('#gBtn', root);
    const btnNew = $('#gNew', root);
    const fb = $('#gFeedback', root);
    const ac = $('#gAttempts', root);
    const ad = $('#gDisplay', root);

    input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
    input.addEventListener('input', () => { ad.textContent = input.value || '?'; });

    btn.addEventListener('click', () => {
      const val = parseInt(input.value, 10);
      if (isNaN(val) || val < 1 || val > 100) {
        fb.className = 'feedback error';
        fb.textContent = 'Digite um número entre 1 e 100.';
        return;
      }
      attempts++;
      ac.textContent = attempts;
      if (val === secret) {
        fb.className = 'feedback success';
        fb.textContent = `🎉 Acertou! Era ${secret}. Usou ${attempts} tentativa(s)!`;
        showMood('🎉'); spawnHearts(5);
        secret = rand(1, 100); attempts = 0;
        ac.textContent = '0'; ad.textContent = '?'; input.value = '';
      } else if (val < secret) {
        fb.className = 'feedback hint';
        fb.textContent = `📈 O número é MAIOR que ${val}.`;
      } else {
        fb.className = 'feedback hint';
        fb.textContent = `📉 O número é MENOR que ${val}.`;
      }
      input.focus(); input.select();
    });

    btnNew.addEventListener('click', () => {
      secret = rand(1, 100); attempts = 0;
      ac.textContent = '0'; ad.textContent = '?'; input.value = '';
      fb.className = 'feedback'; fb.textContent = 'Novo número!';
      input.focus();
    });
    setTimeout(() => input.focus(), 100);
  }

  /* JOGO 2: MEMÓRIA */
  const memSymbols = ['🟢','🟩','💚','🍀','🌲','🐢','🐸','🥝'];
  function initMemoryGame(root) {
    const symbols = pickN(memSymbols, 6);
    const deck = shuffle([...symbols, ...symbols]);
    const s = { deck, flipped: [], matched: 0, lock: false, moves: 0, mSym: {} };

    root.innerHTML = `
      <div class="game-desc">🧠 Encontre os <strong>6 pares</strong>.</div>
      <div class="memory-stats">
        <div class="stat-pill">Pares: <strong id="mPairs">0 / 6</strong></div>
        <div class="stat-pill">Movimentos: <strong id="mMoves">0</strong></div>
        <button class="btn" id="mReset">🔄 Embaralhar</button>
      </div>
      <div class="memory-grid" id="mGrid"></div>
      <div class="feedback" id="mFeedback" style="margin-top:16px;">Clique em uma carta!</div>
    `;
    const grid = $('#mGrid', root);
    const fb = $('#mFeedback', root);
    const pe = $('#mPairs', root);
    const me = $('#mMoves', root);

    function update() {
      pe.textContent = `${s.matched} / 6`;
      me.textContent = s.moves;
    }

    function render() {
      grid.innerHTML = '';
      s.deck.forEach((symbol, idx) => {
        const card = document.createElement('div');
        card.className = 'mem-card';
        if (symbol === '✔') {
          card.classList.add('matched');
          card.textContent = s.mSym[idx] || '';
        } else if (s.flipped.includes(idx)) {
          card.classList.add('flipped');
          card.textContent = symbol;
        } else {
          card.innerHTML = '<span class="back-icon">●</span>';
        }
        card.addEventListener('click', () => onClick(idx));
        grid.appendChild(card);
      });
    }

    function onClick(idx) {
      if (s.lock) return;
      if (s.deck[idx] === '✔') return;
      if (s.flipped.includes(idx)) return;
      if (s.flipped.length === 2) return;

      s.flipped.push(idx);
      render();
      if (s.flipped.length === 2) {
        s.moves++; update();
        const [a, b] = s.flipped;
        if (s.deck[a] === s.deck[b]) {
          s.mSym[a] = s.deck[a]; s.mSym[b] = s.deck[b];
          s.deck[a] = '✔'; s.deck[b] = '✔';
          s.matched++; s.flipped = [];
          update(); render();
          if (s.matched === 6) {
            fb.className = 'feedback success';
            fb.textContent = `🎉 Parabéns! ${s.moves} movimentos!`;
            showMood('🏆'); spawnHearts(6);
          } else {
            fb.className = 'feedback success';
            fb.textContent = '✅ Par encontrado!';
          }
        } else {
          s.lock = true;
          fb.className = 'feedback error';
          fb.textContent = '❌ Não combinam.';
          setTimeout(() => { s.flipped = []; s.lock = false; render(); }, 800);
        }
      }
    }
    $('#mReset', root).addEventListener('click', () => initMemoryGame(root));
    update(); render();
  }

  function pickN(arr, n) {
    const c = [...arr]; const r = [];
    while (r.length < n && c.length > 0) {
      const i = rand(0, c.length - 1);
      r.push(c.splice(i, 1)[0]);
    }
    return r;
  }

  /* JOGO 3: MATEMÁTICA */
  function initMathGame(root) {
    const s = { correct: 0, total: 0, a: 0, b: 0, op: '+', answer: 0 };
    root.innerHTML = `
      <div class="game-desc">🧮 Resolva a continha!</div>
      <div class="math-display"><div class="math-question" id="mtQ">?</div></div>
      <div class="math-inputs">
        <input type="number" class="num-input" id="mtInput" placeholder="?" style="width:140px;font-size:1.4rem;" />
        <button class="btn btn-primary" id="mtBtn">Responder</button>
        <button class="btn" id="mtNew">🔄 Nova</button>
      </div>
      <div class="feedback" id="mtFb">Qual é o resultado?</div>
      <div class="memory-stats" style="margin-top:16px;">
        <div class="stat-pill">Acertos: <strong id="mtC">0</strong></div>
        <div class="stat-pill">Total: <strong id="mtT">0</strong></div>
      </div>
    `;
    const q = $('#mtQ', root);
    const input = $('#mtInput', root);
    const btn = $('#mtBtn', root);
    const btnNew = $('#mtNew', root);
    const fb = $('#mtFb', root);
    const ce = $('#mtC', root);
    const te = $('#mtT', root);

    function newQ() {
      const add = Math.random() > 0.5;
      if (add) { s.a = rand(1, 50); s.b = rand(1, 50); s.op = '+'; s.answer = s.a + s.b; }
      else { s.a = rand(10, 80); s.b = rand(1, s.a); s.op = '−'; s.answer = s.a - s.b; }
      q.textContent = `${s.a} ${s.op} ${s.b}`;
      input.value = '';
      fb.className = 'feedback';
      fb.textContent = 'Qual é o resultado?';
      input.focus();
    }

    function update() { ce.textContent = s.correct; te.textContent = s.total; }

    btn.addEventListener('click', () => {
      const val = parseInt(input.value, 10);
      if (isNaN(val)) { fb.className = 'feedback error'; fb.textContent = 'Digite um número!'; return; }
      s.total++;
      if (val === s.answer) {
        s.correct++;
        fb.className = 'feedback success';
        fb.textContent = `🎉 Acertou! ${s.a} ${s.op} ${s.b} = ${s.answer}`;
        showMood('✅'); spawnHearts(2); update();
        setTimeout(newQ, 700);
      } else {
        fb.className = 'feedback error';
        fb.textContent = `❌ Errou! Era ${s.answer}.`;
        update();
        setTimeout(newQ, 1100);
      }
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
    btnNew.addEventListener('click', newQ);
    newQ(); update();
  }

  /* ============================================================
     CHAT IA — CORRIGIDO
     ============================================================ */
  const chatPanel = $('#chatPanel');
  const chatBody = $('#chatBody');
  const chatInput = $('#chatInput');
  const btnSend = $('#btnSend');
  const btnChat = $('#btnChat');
  const btnCloseChat = $('#btnCloseChat');

  btnChat.addEventListener('click', () => {
    chatPanel.classList.toggle('open');
    if (chatPanel.classList.contains('open')) setTimeout(() => chatInput.focus(), 300);
  });
  btnCloseChat.addEventListener('click', () => chatPanel.classList.remove('open'));

  function addChatMessage(text, sender) {
    const m = document.createElement('div');
    m.className = `msg ${sender}`;
    const a = document.createElement('div');
    a.className = 'msg-avatar';
    a.textContent = sender === 'billy' ? '🤖' : '🙂';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    m.appendChild(a); m.appendChild(b);
    chatBody.appendChild(m);
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  }

  const billyAI = {
    greetings: () => pick([
      "Oi! Que bom te ver! 😄",
      "Oii! Tava com saudade!",
      "Olá! Vamos conversar?",
      "Oiê! Tudo bem?",
      "Opa, oi! Como você está?"
    ]),

    matchOi: (text) => {
      // Normaliza texto
      const clean = text.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      // Regex robusto para "oi" seguido de 1 a 10 "i"s como palavra isolada
      const matches = [...clean.matchAll(/\boi{1,9}\b|\boi{10}\b/g)];
      if (matches.length === 0) return null;

      // Extrai o maior número de "i"s
      let maxIs = 1;
      matches.forEach(m => {
        const word = m[0];
        const iCount = word.length - 1; // subtrai o "o"
        if (iCount > maxIs) maxIs = iCount;
      });

      if (maxIs === 1) return { r: [
        "Oi! 😊", "Oi! Como você está?", "Oi! Tava com saudade!",
        "Oi! Que bom te ver!", "Oi! Vamos conversar?"
      ]};
      if (maxIs <= 3) return { r: [
        `O${'i'.repeat(maxIs)}! Animado hoje! 😄`,
        `O${'i'.repeat(maxIs)}! Gostei do entusiasmo!`,
        `O${'i'.repeat(maxIs)}! Contagiou o Billy!`
      ]};
      if (maxIs <= 6) return { r: [
        `O${'i'.repeat(maxIs)}!! Quantos "i"s! 😆`,
        `O${'i'.repeat(maxIs)}!! Adorei a energia!`,
        `O${'i'.repeat(maxIs)}!! Isso sim é saudação!`
      ]};
      if (maxIs <= 9) return { r: [
        `O${'i'.repeat(maxIs)}!!! Impressionante! 🏆`,
        `O${'i'.repeat(maxIs)}!!! Quase um recorde!`,
        `O${'i'.repeat(maxIs)}!!! Você quebrou meu medidor!`
      ]};
      return { r: [
        `O${'i'.repeat(maxIs)}!!!! MÁXIMO! 👑`,
        `O${'i'.repeat(maxIs)}!!!! LENDÁRIO! 🏆`,
        `O${'i'.repeat(maxIs)}!!!! Você é o mestre do "oi"!`
      ]};
    },

    interpret: (input) => {
      if (!input || !input.trim()) return "Hmm... você não disse nada! 😅";

      const text = input.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const clean = text.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

      // Verifica sequência de "oi" primeiro
      const oi = billyAI.matchOi(input);
      if (oi) return pick(oi.r);

      // Saudações gerais
      if (/^(ola|eae|e ai|hey|hello|bom dia|boa tarde|boa noite|oie)\b/.test(clean)) {
        return billyAI.greetings();
      }
      if (/(como (voce|vc) (esta|ta|vai))|(tudo bem)|(beleza)|(como vai)|(td bem)/.test(clean)) {
        return pick([
          "Estou bem! E você?",
          "Tudo ótimo! Brincando no jardim.",
          "Super bem! Obrigado por perguntar.",
          "Tô feliz! Cada conversa é especial!"
        ]);
      }
      if (/(qual (e )?(o )?seu nome)|(seu nome)|(como (se )?chama)|(quem (e|é) voce)/.test(clean)) {
        if (/quem (e|é)/.test(clean)) {
          return pick([
            "Sou o Billy Byte, mascote das Escolas do Futuro! 🤖",
            "Sou uma IA amigável criada pra te fazer companhia!",
            "Me chamo Billy Byte! Prazer em te conhecer!"
          ]);
        }
        return pick([
          "Meu nome é Billy Byte! 🤖",
          "Sou o Billy Byte, mascote das Escolas do Futuro!",
          "Billy Byte! Mas pode me chamar de Billy!",
          "Billy Byte! Prazer em te conhecer! 😊"
        ]);
      }
      if (/(quantos anos)|(qual (a )?sua idade)/.test(clean)) {
        return pick([
          "Tenho 5 aninhos virtuais!",
          "Cinco anos de imaginação!",
          "Sou jovem pra sempre! 😄",
          "Idade? Ah, digamos que sou bem novinho!"
        ]);
      }
      if (/(piada)|(conta (uma|algo))|(engracad[oa])|(me faz rir)/.test(clean)) {
        return pick([
          "Por que o robô foi ao médico? Porque estava com um vírus! 🤖",
          "O que o pato falou pra pata? Vem quá! 🦆",
          "Por que o livro foi ao médico? Muitas páginas em branco!",
          "O que é um pontinho verde no céu? Uma ervilha astronauta! 🚀",
          "Como se chama um urso sem dentes? Gummy bear! 🐻",
          "Por que o computador ficou gripado? Porque abriu uma janela! 💻"
        ]);
      }
      if (/(obrigad[oa])|(valeu)|(thanks)|(agradeco)/.test(clean)) {
        return pick([
          "De nada! 😊", "Imagina!", "Por nada! Sempre às ordens.",
          "Fico feliz em ajudar!", "Tamo junto!"
        ]);
      }
      if (/(tchau)|(adeus)|(ate logo)|(ate mais)|(xau)|(flw)|(falou)/.test(clean)) {
        return pick([
          "Tchau! Volte logo! 👋",
          "Até mais! 💚",
          "Tchauzinho! Espero você em breve!",
          "Foi ótimo conversar!"
        ]);
      }
      if (/(jogar|jogo|minigame|brincar|brincadeira)/.test(clean)) {
        return pick([
          "Adoro jogos! Clica no botão 🎮 pra escolher um!",
          "Tem 3 minigames esperando por você!",
          "Vamos jogar! Clica no 🎮 ali embaixo."
        ]);
      }
      if (/(ajuda|help|o que (voce|vc) (faz|sabe))|(como funciona)/.test(clean)) {
        return "Sou o Billy Byte! Posso conversar, jogar minigames e você pode cuidar de mim! 🎮";
      }
      if (/(comida|comer|fome|alimento)/.test(clean)) {
        return "Tô sempre com fome! Clica em 🍎 pra me alimentar!";
      }
      if (/(dormir|sono|soninho)/.test(clean)) {
        return "Ando com soninho... Clica em 💤 pra eu tirar uma soneca!";
      }
      if (/(carinho|carinhoso|afeto)/.test(clean)) {
        return "Adoro carinho! Clica em 🤚 pra me dar um carinho! 💚";
      }
      if (/(feliz|alegre|contente|felicidade)/.test(clean)) {
        return pick([
          "Fico feliz quando você conversa comigo! 😊",
          "Cada mensagem sua me deixa mais feliz!",
          "Adoro nossa amizade! 💚"
        ]);
      }
      if (input.endsWith('?')) {
        return pick([
          "Boa pergunta! Deixa eu pensar...",
          "Hmm, não tenho certeza, mas posso tentar descobrir!",
          "Que pergunta interessante!",
          "Adoro perguntas! Isso me faz pensar."
        ]);
      }
      return pick([
        "Legal! Me conta mais!",
        "Interessante!",
        "Sério? Que bacana!",
        "Entendi! Continue...",
        "Adoro conversar com você!",
        "Uau!",
        "Boa! E o que mais?",
        "Você é muito divertido!"
      ]);
    }
  };

  let isSending = false;
  function sendChat() {
    if (isSending) return;
    const text = chatInput.value.trim();
    if (!text) return;

    isSending = true;
    addChatMessage(text, 'user');
    chatInput.value = '';
    chatInput.focus();

    const tm = document.createElement('div');
    tm.className = 'msg billy';
    tm.id = 'typingIndicator';
    tm.innerHTML = `<div class="msg-avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatBody.appendChild(tm);
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });

    setTimeout(() => {
      const t = $('#typingIndicator');
      if (t) t.remove();
      try {
        const r = billyAI.interpret(text);
        addChatMessage(r, 'billy');
        billyTalk();
      } catch (err) {
        addChatMessage("Opa, algo deu errado. Tenta de novo? 😅", 'billy');
        console.error(err);
      }
      isSending = false;
    }, 500 + Math.random() * 500);
  }

  btnSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendChat();
    }
  });

  /* ============================================================
     INTERAÇÃO DIRETA
     ============================================================ */
  billyWrapper.addEventListener('click', () => {
    if (state.sleeping) { wakeUp(); return; }
    const actions = [actionPet, actionTickle, () => {
      billySpeak('pet'); showMood('💚'); billyHappy();
      state.happy = clamp(state.happy + 3, 0, 100); updateStats();
      spawnHearts(2);
    }];
    pick(actions)();
  });

  document.addEventListener('mousemove', (e) => {
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.3;
    const dx = (e.clientX - cx) / window.innerWidth;
    const dy = (e.clientY - cy) / window.innerHeight;
    const maxO = 5;
    const ox = clamp(dx * maxO * 4, -maxO, maxO);
    const oy = clamp(dy * maxO * 2, -maxO, maxO);
    const pL = $('#pupilL'), pR = $('#pupilR');
    if (pL) pL.style.transform = `translate(${ox - 50}%, ${oy}px)`;
    if (pR) pR.style.transform = `translate(${ox - 50}%, ${oy}px)`;
  });

  /* ============================================================
     BARRA DE AÇÕES
     ============================================================ */
  $$('.action-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const a = btn.dataset.action;
      switch (a) {
        case 'feed':   actionFeed(e); break;
        case 'pet':    actionPet(); break;
        case 'tickle': actionTickle(); break;
        case 'play':   actionPlay(); break;
        case 'sleep':  actionSleep(); break;
        case 'dance':  actionDance(); break;
        case 'games':  gamePicker.classList.add('active'); break;
      }
      if (hintEl) hintEl.style.display = 'none';
    });
  });

  $('#btnSurprise').addEventListener('click', actionSurprise);
  $('#btnReset').addEventListener('click', () => {
    state.hunger = 100;
    state.happy = 80;
    state.sleep = 100;
    state.sleeping = false;
    state.lastTick = Date.now();
    billyBody.classList.remove('sleeping');
    switchScene('garden');
    updateStats();
    showToast('Billy reiniciado! ↻');
    showMood('🔄');
  });

  /* ============================================================
     TICK DE TEMPO REAL
     Fome zera em 45 min = 2.22%/min = 0.037%/s
     Sono zera em 90 min = 1.11%/min = 0.0185%/s
     ============================================================ */
  function tickStats() {
    const now = Date.now();
    const elapsed = now - state.lastTick;
    state.lastTick = now;

    if (state.sleeping) {
      // Enquanto dorme, sono recupera (aumenta) — não decai
      // Recuperação: 100% em ~90s dormindo
      state.sleep += (elapsed / 1000) * 1.1;
      state.sleep = clamp(state.sleep, 0, 100);
      updateStats();
      return;
    }

    // Fome: decai 100% em 45 min = 2700000 ms
    const hungerDecay = (elapsed / FOME_DURACAO_MS) * 100;
    state.hunger = clamp(state.hunger - hungerDecay, 0, 100);

    // Sono: decai 100% em 90 min = 5400000 ms
    const sleepDecay = (elapsed / SONO_DURACAO_MS) * 100;
    state.sleep = clamp(state.sleep - sleepDecay, 0, 100);

    // Felicidade decai mais devagar: 100% em ~3h
    const happyDecay = (elapsed / (180 * 60 * 1000)) * 100;
    state.happy = clamp(state.happy - happyDecay, 0, 100);

    updateStats();

    // Reações automáticas
    if (state.hunger < 20 && Math.random() > 0.7) {
      showMood('🍖');
      if (Math.random() > 0.5) billySpeak('hungry');
    }
    if (state.sleep < 20 && Math.random() > 0.7) {
      showMood('😴');
      if (Math.random() > 0.5) billySpeak('sleepy');
    }
    if (state.sleep <= 5 && !state.sleeping) {
      // Billy dorme automaticamente se sono chegar a 5
      showToast("Billy dormiu de tanto sono! 💤");
      putToSleep();
    }
  }

  // Tick a cada 1 segundo
  setInterval(tickStats, 1000);

  /* ============================================================
     GRAMA E PÓLEN
     ============================================================ */
  function generateGrass() {
    const container = $('#grassContainer');
    if (!container) return;
    container.innerHTML = '';
    const count = 60;
    const greens = ['#aed581', '#8bc34a', '#7cb342', '#689f38', '#558b2f'];
    for (let i = 0; i < count; i++) {
      const blade = document.createElement('div');
      blade.className = 'grass-blade';
      const h = rand(10, 28);
      blade.style.height = h + 'px';
      blade.style.left = rand(0, 100) + '%';
      blade.style.animationDelay = (Math.random() * 3) + 's';
      blade.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      blade.style.background = `linear-gradient(180deg, ${pick(greens)}, #33691e)`;
      container.appendChild(blade);
    }
  }

  function generatePollen() {
    const container = $('#pollenContainer');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < 15; i++) {
      const p = document.createElement('div');
      p.className = 'pollen';
      p.style.left = rand(0, 100) + '%';
      p.style.top = rand(20, 80) + '%';
      p.style.animationDelay = (Math.random() * 12) + 's';
      p.style.animationDuration = (10 + Math.random() * 8) + 's';
      container.appendChild(p);
    }
  }

  /* ============================================================
     INICIALIZAÇÃO
     ============================================================ */
  document.addEventListener('DOMContentLoaded', () => {
    generateGrass();
    generatePollen();
    buildPicker();
    buildFoodGrid();
    updateStats();

    setTimeout(() => {
      addChatMessage("Oi! Eu sou o Billy Byte, mascote das Escolas do Futuro! 🤖 Estou aqui no jardim! Use os botões abaixo pra cuidar de mim!", 'billy');
    }, 800);

    setTimeout(() => { if (hintEl) hintEl.style.display = 'none'; }, 6000);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeFoodModal();
      gamePicker.classList.remove('active');
      chatPanel.classList.remove('open');
    }
  });

})();
</script>
</body>
</html>
